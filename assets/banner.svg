<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#111413"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 800 54px 'Segoe UI', Arial, sans-serif; fill: url(#mint); letter-spacing: 6px; }
    .sub   { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #a3a3a3; letter-spacing: 1px; }
    .tag   { font: 600 15px 'Consolas', monospace; fill: #34d399; }
    .glow  { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: .7 } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .scan { animation: sweep 4s linear infinite; }
    @keyframes sweep { 0% { transform: translateX(-860px) } 100% { transform: translateX(860px) } }
  </style>
  <rect width="860" height="220" rx="14" fill="url(#bg)" stroke="#262626"/>
  <text x="430" y="92" text-anchor="middle" class="title glow" opacity=".4">G.U.A.R.D.</text>
  <text x="430" y="92" text-anchor="middle" class="title">G.U.A.R.D.</text>
  <text x="430" y="128" text-anchor="middle" class="sub">Guided User Assessment &amp; Resume Defense</text>
  <text x="430" y="168" text-anchor="middle" class="tag">&gt; your AI interview coach — 100% on your hardware. zero cloud video.<tspan class="cursor">_</tspan></text>
  <g class="scan"><rect x="0" y="0" width="3" height="220" fill="#34d399" opacity="0.35"/></g>
  <rect x="20" y="196" width="820" height="1" fill="#262626"/>
  <circle cx="34" cy="34" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="48" y="39" class="tag" font-size="12">LIVE · EDGE-AI · SOVEREIGN</text>
</svg>
